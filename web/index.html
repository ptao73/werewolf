<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>狼人杀</title>
<style>
  :root { color-scheme: dark; --bg:#14161b; --card:#1e2128; --text:#e7e9ee; --dim:#8a90a0; --accent:#e0a93b; --priv:#5fb3ff; --warn:#ff7a6b; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  /* 上下两块：上面是消息（自己滚动），下面是操作区（最多占半屏），互不遮挡 */
  /* 整个页面钉死在屏幕上（iPhone 弹出键盘后不会把整页推上去）；高度由 JS 跟随可见区域调整 */
  body { position:fixed; inset:0; display:flex; flex-direction:column; height:100dvh; overflow:hidden; margin:0; background:var(--bg); color:var(--text); font:16px/1.55 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  header { flex:none; z-index:2; background:var(--bg); padding:10px 14px; border-bottom:1px solid #2a2e37; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  #status { color:var(--dim); font-size:13px; }
  #log { flex:1; min-height:0; overflow-y:auto; padding:10px 14px; -webkit-overflow-scrolling:touch; }
  .ev { white-space:pre-wrap; margin:3px 0; }
  .public { }
  .private { color:var(--priv); }
  .thinking, .info { color:var(--dim); font-size:14px; }
  .warn { color:var(--warn); }
  .reveal { color:var(--accent); font-weight:600; }
  .night { margin-top:14px; color:#a9b4ff; font-weight:600; }
  .day { margin-top:14px; color:var(--accent); font-weight:600; }
  #panel { flex:none; background:var(--card); border-top:1px solid #2a2e37; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); max-height:40dvh; overflow-y:auto; }
  #panel .task { margin-bottom:4px; font-weight:600; font-size:15px; }
  #panel .line { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px; color:var(--dim); }
  #panel .line .grow { flex:1; min-width:0; }
  textarea { width:100%; min-height:44px; height:44px; font:inherit; color:var(--text); background:#111318; border:1px solid #333845; border-radius:8px; padding:8px; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  button { font:inherit; color:var(--text); background:#2c3140; border:1px solid #3a4052; border-radius:8px; padding:7px 11px; }
  button.primary { background:var(--accent); color:#1a1300; border-color:var(--accent); font-weight:600; }
  button.danger { background:transparent; color:var(--warn); border-color:#5a2f2b; }
  button:disabled { opacity:.5; }
  details { margin-top:8px; color:var(--dim); }
  .pool { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:6px; }
  .pool label { white-space:nowrap; }
  input[type=text], select { font:inherit; color:var(--text); background:#111318; border:1px solid #333845; border-radius:8px; padding:8px; }
  input[type=text] { flex:1; min-width:120px; }
  .countdown { color:var(--accent); font-size:13px; font-weight:400; margin-left:6px; }
  .members { margin:4px 0 6px; }
  hr { border:0; border-top:1px solid #2a2e37; margin:10px 0; }
  header { gap:6px !important; }
  .hbtn { padding:5px 8px; font-size:13px; white-space:nowrap; }
  #status { color:var(--dim); }
  @media (max-width: 420px) { header .title { display:none; } }   /* 窄屏只显示 🐺 */
  #board h3 { margin:14px 0 4px; color:var(--accent); }
  #board .rtext { white-space:pre-wrap; font-size:14px; line-height:1.6; }
  /* 排行榜/规则页盖住消息区，但不盖住顶部按钮栏（随时能点"大厅"回来） */
  header { position:relative; z-index:10; background:var(--bg); }
  #board { position:fixed; inset:0; padding-top:64px !important; z-index:5; background:rgba(10,11,14,.97); overflow:auto; padding:14px; }
  #board table { border-collapse:collapse; width:100%; font-size:14px; }
  #board th, #board td { padding:6px 5px; border-bottom:1px solid #2a2e37; text-align:right; white-space:nowrap; }
  #board th:nth-child(2), #board td:nth-child(2) { text-align:left; }
  #board .detail { color:var(--dim); font-size:12px; white-space:normal; text-align:left; }
  #board .rules { color:var(--dim); font-size:13px; margin-top:10px; }
  .seats { display:flex; flex-wrap:wrap; gap:6px 8px; margin:4px 0 2px 2px; }
  .seat { padding:2px 8px; border:1px solid #333845; border-radius:6px; }
  .seat.me { color:var(--priv); border-color:var(--priv); font-weight:600; }
  .seat.dead { color:var(--warn); border-color:#5a2f2b; text-decoration:line-through; }
  /* 顶部固定座位栏：不随对话滚动；点座位看他的发言 */
  #seatbar { flex:none; display:flex; flex-wrap:wrap; gap:5px; padding:6px 12px; border-bottom:1px solid #2a2e37; background:var(--bg); z-index:3; }
  #seatbar button { padding:3px 8px; font-size:13px; border-radius:6px; }
  #seatbar .me { color:var(--priv); border-color:var(--priv); font-weight:600; }
  #seatbar .dead { color:var(--warn); border-color:#5a2f2b; text-decoration:line-through; }
  .notice { color:var(--accent); margin-bottom:6px; font-size:14px; }
  .err { color:var(--warn); margin-top:4px; font-size:14px; }
  .err:empty { display:none; }
</style>
</head>
<body>
<header><h1>🐺<span class="title"> 狼人杀</span></h1><button id="boardBtn" class="hbtn">🏆 排行榜</button><button id="rulesBtn" class="hbtn">📖 规则</button><button id="startBtn" class="hbtn primary">▶ 开局</button><button id="adminBtn" class="hbtn" hidden>⚙</button><button id="status" class="hbtn">连接中…</button></header>
<div id="seatbar" hidden></div>
<div id="board" hidden></div>
<main id="log"></main>
<section id="panel"></section>
<script src="/app.js"></script>
</body>
</html>
